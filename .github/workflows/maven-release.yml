#
# Central: SONATYPE_USERNAME, SONATYPE_PASSWORD (Central Portal user token — https://central.sonatype.org/publish/generate-portal-token)
# GPG: GPG_PASSPHRASE, GPG_SECRET_KEYS, GPG_OWNERTRUST (base64)
# Job-level MAVEN_* env ensures setup-java settings.xml has credentials for deploy.

name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (major.minor.patch - patch should be even number)'
        required: false
      dryRun:
        description: 'Dry Run? (uncheck to perform a release)'
        required: true
        type: boolean
        default: true
      sonatypeUsername:
        description: 'Central Portal token username (overrides SONATYPE_USERNAME secret)'
        required: false
      sonatypePassword:
        description: 'Central Portal token password (overrides SONATYPE_PASSWORD secret)'
        required: false

permissions:
  contents: write

jobs:
  Tag:
    runs-on: ubuntu-latest
    if: github.repository == 'adobe/asset-share-commons' && github.ref == 'refs/heads/main'

    outputs:
      version: ${{ steps.store-version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          cache: maven

      - name: Initialize mandatory git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email noreply@github.com

      - name: Tag DryRun with Maven
        if: ${{ inputs.dryRun }}
        run: mvn -B release:clean release:prepare -DreleaseVersion=${{ inputs.releaseVersion }} -DdryRun=true -Dgpg.skip=true -Pcloud

      - name: Tag with Maven
        if: ${{ !inputs.dryRun }}
        run: mvn -B release:clean release:prepare -DreleaseVersion=${{ inputs.releaseVersion }} -Dgpg.skip=true -Pcloud

      - name: Store Version
        id: store-version
        run: echo "version=$(grep ^scm.tag= release.properties | sed -e 's/scm.tag=asset-share-commons-//g')" >> $GITHUB_OUTPUT

  Github_Release:
    needs: Tag
    runs-on: ubuntu-latest
    if: ${{ !inputs.dryRun }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: asset-share-commons-${{ needs.Tag.outputs.version }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          cache: maven

      - name: Maven Verify
        run: mvn -U clean verify -Pcloud

      - name: Generate Release Changelog
        id: generate-release-changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configuration: ".github/.release-changelog-config.json"
          toTag: asset-share-commons-${{ needs.Tag.outputs.version }}

      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: asset-share-commons-${{ needs.Tag.outputs.version }}
          release_name: asset-share-commons-${{ needs.Tag.outputs.version }}
          body: ${{ steps.generate-release-changelog.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Upload Release Artifacts
        id: upload-release-artifacts
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: asset-share-commons-${{ needs.Tag.outputs.version }}
          files: |
            all/target/asset-share-commons.all-*.zip
            ui.content.sample/target/asset-share-commons.ui.content.sample-*.zip

  Maven_Central_Deploy:
    needs: Tag
    runs-on: ubuntu-latest
    if: ${{ !inputs.dryRun }}
    env:
      MAVEN_USERNAME: ${{ inputs.sonatypeUsername || secrets.SONATYPE_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ inputs.sonatypePassword || secrets.SONATYPE_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: asset-share-commons-${{ needs.Tag.outputs.version }}

      - name: Import GPG key
        env:
          GPG_SECRET_KEYS: ${{ secrets.GPG_SECRET_KEYS }}
          GPG_OWNERTRUST: ${{ secrets.GPG_OWNERTRUST }}
        run: |
          if [ -n "${GPG_SECRET_KEYS}" ]; then
            echo "$GPG_SECRET_KEYS" | base64 --decode | gpg --import --no-tty --batch --yes
          fi
          if [ -n "${GPG_OWNERTRUST}" ]; then
            echo "$GPG_OWNERTRUST" | base64 --decode | gpg --import-ownertrust --no-tty --batch --yes
          fi

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Verify GPG secret key is available
        run: |
          gpg --list-secret-keys --keyid-format LONG
          if ! gpg --list-secret-keys --with-colons 2>/dev/null | grep -q '^sec:'; then
            echo "::error::No GPG secret key found. Configure GPG_SECRET_KEYS and GPG_OWNERTRUST (base64-encoded)."
            exit 1
          fi

      - name: Deploy to Maven Central
        run: mvn clean deploy -Pcloud,release

  Changelog:
    runs-on: ubuntu-latest
    needs: Tag
    if: ${{ !inputs.dryRun }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: "Build Changelog Fragment"
        id: build_changelog_fragment
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configuration: ".github/.release-changelog-config.json"
          toTag: asset-share-commons-${{ needs.Tag.outputs.version }}

      - name: "Build Changelog"
        run: |
          echo -e "${{steps.build_changelog_fragment.outputs.changelog}}" | cat - CHANGELOG_HISTORY.md > tmp
          mv tmp CHANGELOG_HISTORY.md
          echo -e '# 📑 Changelog\n\n' | cat - CHANGELOG_HISTORY.md > CHANGELOG.md

      - name: Commit Changelog
        run: |
          git config user.name "GitHub Actions"
          git config user.email noreply@github.com
          git add CHANGELOG.md
          git add CHANGELOG_HISTORY.md
          git commit -m 'Update Changelog.'
          git push
