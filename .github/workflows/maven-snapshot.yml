# Snapshot deploy to Maven Central (Sonatype Central Portal).
# Secrets: SONATYPE_USERNAME, SONATYPE_PASSWORD, GPG_PASSPHRASE, GPG_SECRET_KEYS, GPG_OWNERTRUST (base64)
#
# Use a Central Portal *user token* (not legacy OSSRH JIRA creds): https://central.sonatype.org/publish/generate-portal-token
# Job-level MAVEN_* env ensures setup-java writes settings.xml before any mvn invocation (avoids empty auth / 401).

name: Release Snapshot to Maven Central

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-snapshot:
    runs-on: ubuntu-latest
    if: github.repository == 'adobe/asset-share-commons' && github.ref == 'refs/heads/main'
    env:
      MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Import GPG key
        env:
          GPG_SECRET_KEYS: ${{ secrets.GPG_SECRET_KEYS }}
          GPG_OWNERTRUST: ${{ secrets.GPG_OWNERTRUST }}
        run: |
          if [ -n "${GPG_SECRET_KEYS}" ]; then
            echo "$GPG_SECRET_KEYS" | base64 --decode | gpg --import --no-tty --batch --yes
          fi
          if [ -n "${GPG_OWNERTRUST}" ]; then
            echo "$GPG_OWNERTRUST" | base64 --decode | gpg --import-ownertrust --no-tty --batch --yes
          fi

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Check snapshot version
        id: snapshot
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: version is not a SNAPSHOT."
          fi

      - name: Verify GPG secret key is available
        if: steps.snapshot.outputs.deploy == 'true'
        run: |
          gpg --list-secret-keys --keyid-format LONG
          if ! gpg --list-secret-keys --with-colons 2>/dev/null | grep -q '^sec:'; then
            echo "::error::No GPG secret key found. Configure repository secrets GPG_SECRET_KEYS and GPG_OWNERTRUST (base64-encoded)."
            exit 1
          fi

      - name: Deploy Snapshot to Maven Central
        if: steps.snapshot.outputs.deploy == 'true'
        run: mvn clean deploy -Pcloud,release,jacoco-report
