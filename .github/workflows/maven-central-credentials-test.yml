# Manual check that SONATYPE_USERNAME / SONATYPE_PASSWORD work against Central (same env names as deploy workflows).
# Does not deploy artifacts. Run from Actions → "Test Maven Central credentials" → Run workflow.

name: Test Maven Central credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-central:
    runs-on: ubuntu-latest
    if: github.repository == 'adobe/asset-share-commons'
    env:
      MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}

    steps:
      # Required so setup-java cache: maven can find pom.xml (otherwise: "No file matched **/pom.xml")
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK (writes ~/.m2/settings.xml for server id central)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Verify secrets are present
        run: |
          if [ -z "${MAVEN_USERNAME}" ] || [ -z "${MAVEN_CENTRAL_TOKEN}" ]; then
            echo "::error::SONATYPE_USERNAME or SONATYPE_PASSWORD is empty. Add both repository secrets."
            exit 1
          fi
          echo "SONATYPE_USERNAME length: ${#MAVEN_USERNAME} (value is not printed)"

      - name: Probe snapshot repository (Basic auth)
        run: |
          set +x
          code=$(curl -sS -o /tmp/central_root_body.txt -w "%{http_code}" \
            -u "${MAVEN_USERNAME}:${MAVEN_CENTRAL_TOKEN}" \
            "https://central.sonatype.com/repository/maven-snapshots/")
          echo "GET maven-snapshots/ → HTTP ${code}"
          if [ "${code}" = "401" ]; then
            echo "::error::401 Unauthorized — Central rejected these credentials. Use a Central Portal user token (https://central.sonatype.org/publish/generate-portal-token), not legacy OSSRH passwords."
            exit 1
          fi
          if [ "${code}" = "000" ]; then
            echo "::error::curl failed to connect."
            exit 1
          fi
          echo "Non-401 response; credentials are accepted for this endpoint."

      - name: Probe reactor POM snapshot metadata path
        run: |
          set +x
          # groupId com.adobe.aem.commons → com/adobe/aem/commons ; artifactId assetshare (root reactor)
          url="https://central.sonatype.com/repository/maven-snapshots/com/adobe/aem/commons/assetshare/maven-metadata.xml"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -u "${MAVEN_USERNAME}:${MAVEN_CENTRAL_TOKEN}" \
            "${url}")
          echo "GET .../assetshare/maven-metadata.xml → HTTP ${code}"
          if [ "${code}" = "401" ]; then
            echo "::error::401 on namespace path — credentials not accepted for this repository."
            exit 1
          fi
          echo "Expected: 200 if snapshots exist, 404 if none yet — both mean auth was not rejected with 401."

      - name: Show Maven server id central (redacted)
        run: |
          if [ -f "${HOME}/.m2/settings.xml" ]; then
            echo "settings.xml server entry (password redacted):"
            sed -e 's/<password>.*<\/password>/<password>***<\/password>/g' "${HOME}/.m2/settings.xml" | head -n 80
          else
            echo "::warning::No ~/.m2/settings.xml from setup-java"
          fi
