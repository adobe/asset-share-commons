# Validates SONATYPE_USERNAME / SONATYPE_PASSWORD by running an actual Maven deploy
# of the root POM snapshot (no modules, no GPG). Uses the same plugin and settings.xml
# path as the real release workflow, so a pass here means credentials will work on deploy.
# Run from Actions → "Test Maven Central credentials" → Run workflow.

name: Test Maven Central credentials

on:
  workflow_dispatch:
    inputs:
      sonatypeUsername:
        description: 'Central Portal token username (overrides SONATYPE_USERNAME secret)'
        required: false
      sonatypePassword:
        description: 'Central Portal token password (overrides SONATYPE_PASSWORD secret)'
        required: false

permissions:
  contents: read

jobs:
  probe-central:
    runs-on: ubuntu-latest
    if: github.repository == 'adobe/asset-share-commons'
    env:
      MAVEN_USERNAME: ${{ inputs.sonatypeUsername || secrets.SONATYPE_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ inputs.sonatypePassword || secrets.SONATYPE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK (writes ~/.m2/settings.xml for server id central)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Verify secrets are present
        run: |
          if [ -z "${MAVEN_USERNAME}" ] || [ -z "${MAVEN_CENTRAL_TOKEN}" ]; then
            echo "::error::SONATYPE_USERNAME or SONATYPE_PASSWORD is empty. Add both repository secrets."
            exit 1
          fi
          echo "SONATYPE_USERNAME length: ${#MAVEN_USERNAME} (value is not printed)"

      - name: Deploy root POM snapshot to Central (no modules, no GPG)
        run: |
          set +e
          mvn -B deploy \
            -DskipTests \
            -Dgpg.skip=true \
            -N \
            2>&1 | tee /tmp/mvn-output.txt
          mvn_exit=${PIPESTATUS[0]}

          echo "--- Maven output (last 50 lines) ---"
          tail -50 /tmp/mvn-output.txt
          echo "--- End Maven output ---"

          if grep -qE "status code: 401|Response: 401|401 Unauthorized" /tmp/mvn-output.txt; then
            echo "::error::401 Unauthorized — Central rejected these credentials."
            echo "::error::Use a Central Portal user token: https://central.sonatype.org/publish/generate-portal-token"
            exit 1
          fi

          if [ "${mvn_exit}" -eq 0 ]; then
            echo "SUCCESS — root POM snapshot deployed to Central. Credentials are valid."
          else
            echo "::notice::Maven exited with code ${mvn_exit} but no 401 in output."
            echo "Credentials were accepted by Central; the failure has a different cause."
            exit "${mvn_exit}"
          fi

      - name: Show Maven settings.xml (redacted)
        if: always()
        run: |
          if [ -f "${HOME}/.m2/settings.xml" ]; then
            echo "settings.xml server entry (password redacted):"
            sed 's/<password>.*<\/password>/<password>***<\/password>/g' "${HOME}/.m2/settings.xml" | head -n 80
          else
            echo "::warning::No ~/.m2/settings.xml from setup-java"
          fi
